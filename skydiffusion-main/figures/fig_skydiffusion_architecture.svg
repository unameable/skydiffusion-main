<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2E3440" flood-opacity=".10"/></filter>
 <style>
 .title{font:700 32px "Microsoft YaHei","Noto Sans CJK SC",Arial;fill:#2E3440}
 .panel{font:700 22px "Microsoft YaHei","Noto Sans CJK SC",Arial;fill:#2E3440}
 .h{font:700 18px "Microsoft YaHei","Noto Sans CJK SC",Arial;fill:#2E3440}
 .s{font:400 15px "Microsoft YaHei","Noto Sans CJK SC",Arial;fill:#667085}
 .tiny{font:400 13px "Microsoft YaHei","Noto Sans CJK SC",Arial;fill:#667085}
 .card{fill:#fff;stroke:#DDE3EA;stroke-width:2;rx:14;filter:url(#shadow)}
 .arr{stroke:#667085;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
 .dash{stroke:#98A2B3;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
 </style>
</defs>
<rect width="1600" height="1100" fill="#fff"/>
<text x="70" y="60" class="title">SkyDiffusion 项目结构与生成流程</text>
<text x="70" y="90" class="s">街景 → Curved-BEV → 条件扩散 → 航拍图</text>

<rect x="55" y="120" width="1490" height="295" rx="22" fill="#F7F9FB"/>
<text x="80" y="155" class="panel">A  项目模块</text>
<rect x="95" y="185" width="1220" height="150" rx="18" fill="#E8EDF2"/>
<rect x="130" y="220" width="195" height="78" class="card"/>
<text x="227" y="249" text-anchor="middle" class="h">数据加载</text><text x="227" y="276" text-anchor="middle" class="s">SkyDataset</text>
<rect x="385" y="220" width="195" height="78" class="card"/>
<text x="482" y="249" text-anchor="middle" class="h">视角转换</text><text x="482" y="276" text-anchor="middle" class="s">Curved-BEV</text>
<rect x="640" y="220" width="225" height="78" class="card"/>
<text x="752" y="249" text-anchor="middle" class="h">条件扩散</text><text x="752" y="276" text-anchor="middle" class="s">LAControlLDM</text>
<rect x="925" y="220" width="195" height="78" class="card"/>
<text x="1022" y="249" text-anchor="middle" class="h">结果保存</text><text x="1022" y="276" text-anchor="middle" class="s">ValidImageLogger</text>
<rect x="1180" y="220" width="195" height="78" class="card"/>
<text x="1277" y="249" text-anchor="middle" class="h">离线评估</text><text x="1277" y="276" text-anchor="middle" class="s">eval/</text>
<path d="M325 259H385M580 259H640M865 259H925M1120 259H1180" class="arr"/>
<rect x="270" y="172" width="260" height="32" rx="10" fill="#fff" stroke="#DDE3EA"/><text x="400" y="194" text-anchor="middle" class="tiny">运行调度  skydiffusion_test.py</text>
<path d="M400 204V220" class="dash"/>
<rect x="875" y="172" width="280" height="32" rx="10" fill="#fff" stroke="#DDE3EA"/><text x="1015" y="194" text-anchor="middle" class="tiny">模型配置与权重  YAML / checkpoint</text>
<path d="M1015 204V220" class="dash"/>
<text x="90" y="370" class="tiny">ldm：VAE · CLIP · 扩散基础 · DDIM</text>
<text x="780" y="370" text-anchor="middle" class="tiny">主箭头表示街景生成链路；文本条件见下图。</text>
<text x="780" y="395" text-anchor="middle" class="tiny">真实航拍图用于训练 / 验证，不作为生成条件。</text>

<rect x="55" y="440" width="1490" height="590" rx="22" fill="#FCFAF5"/>
<text x="80" y="480" class="panel">B  核心模型：LAControlLDM</text>
<rect x="80" y="505" width="1420" height="465" rx="18" fill="#fff" stroke="#E8E0CC" stroke-width="2"/>
<rect x="110" y="555" width="185" height="72" class="card"/><text x="202" y="584" text-anchor="middle" class="h">BEV 条件图</text><text x="202" y="608" text-anchor="middle" class="s">3 × 512 × 512</text>
<rect x="335" y="555" width="220" height="72" class="card"/><text x="445" y="581" text-anchor="middle" class="h">冻结条件编码器</text><text x="445" y="605" text-anchor="middle" class="s">VAE encoder 副本 · 4×64×64</text>
<rect x="595" y="555" width="145" height="72" class="card"/><text x="667" y="584" text-anchor="middle" class="h">通道拼接</text><text x="667" y="608" text-anchor="middle" class="s">4 + 4 = 8</text>
<rect x="790" y="555" width="235" height="72" class="card"/><text x="907" y="584" text-anchor="middle" class="h">LAControlNet</text><text x="907" y="608" text-anchor="middle" class="s">多尺度控制特征</text>
<path d="M295 591H335M555 591H595M740 591H790" class="arr"/>
<text x="460" y="545" class="tiny">条件潜变量</text>

<rect x="110" y="690" width="185" height="72" class="card"/><text x="202" y="719" text-anchor="middle" class="h">文本提示</text><text x="202" y="743" text-anchor="middle" class="s">txt</text>
<rect x="335" y="690" width="220" height="72" class="card"/><text x="445" y="719" text-anchor="middle" class="h">冻结文本编码器</text><text x="445" y="743" text-anchor="middle" class="s">CLIP</text>
<rect x="595" y="690" width="220" height="72" class="card"/><text x="705" y="719" text-anchor="middle" class="h">当前噪声潜变量</text><text x="705" y="743" text-anchor="middle" class="s">z_t · 时间步 t</text>
<path d="M295 726H335" class="arr"/>
<path d="M555 710C650 650 760 650 850 628" class="arr"/>
<path d="M555 748C690 795 760 790 850 690" class="arr"/>
<text x="645" y="665" class="tiny">文本上下文</text>

<rect x="850" y="690" width="245" height="72" class="card"/><text x="972" y="719" text-anchor="middle" class="h">Controlled U-Net</text><text x="972" y="743" text-anchor="middle" class="s">预测噪声</text>
<rect x="1135" y="690" width="190" height="72" class="card"/><text x="1230" y="719" text-anchor="middle" class="h">DDIM 采样器</text><text x="1230" y="743" text-anchor="middle" class="s">逐步更新潜变量</text>
<rect x="1365" y="690" width="105" height="72" class="card"/><text x="1417" y="719" text-anchor="middle" class="h">VAE</text><text x="1417" y="743" text-anchor="middle" class="s">解码器</text>
<path d="M815 726H850" class="arr"/>
<path d="M1095 726H1135" class="arr"/>
<path d="M1325 726H1365" class="arr"/>
<text x="1170" y="680" class="tiny">最终潜变量</text>

<path d="M705 690V635" class="arr"/><text x="714" y="660" class="tiny">z_t</text>
<path d="M705 762V850H972V762" class="arr"/>
<text x="790" y="875" class="tiny">z_t, t</text>
<path d="M907 627V690" class="arr"/><text x="925" y="665" class="tiny">13 路多尺度控制特征</text>
<path d="M705 690V645H665V627" class="arr"/>
<rect x="1365" y="820" width="105" height="65" class="card"/><text x="1417" y="847" text-anchor="middle" class="h">航拍图</text><text x="1417" y="870" text-anchor="middle" class="s">3×512×512</text>
<path d="M1417 762V820" class="arr"/>
<rect x="140" y="825" width="200" height="58" class="card"/><text x="240" y="850" text-anchor="middle" class="h">初始随机噪声 z_T</text><text x="240" y="873" text-anchor="middle" class="s">初始化</text>
<path d="M340 854H650V762" class="arr"/>
<path d="M1230 762V930H705V762" class="arr"/>
<text x="930" y="952" class="tiny">下一步 z_t（DDIM 反馈）</text>
<text x="105" y="1000" class="tiny">13 路控制 → U-Net 中间层与跳跃连接</text>
<text x="840" y="1000" class="tiny">按默认 lacldm_v15.yaml 绘制 · 张量尺寸以 512 × 512 输入为例</text>
</svg>
